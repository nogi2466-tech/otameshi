<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkBase — URL管理アプリ</title>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafa;--surface:#fff;--text:#1a1a1a;--text-sub:#666;
  --border:#e5e5e5;--accent:#2563eb;--accent-light:#dbeafe;
  --danger:#ef4444;--success:#22c55e;--radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 8px 30px rgba(0,0,0,.12);
  /* Category Colors */
  --c-keio:#e63946;--c-jr:#2a9d8f;--c-major:#2563eb;--c-other:#7c3aed;
  --c-material:#f59e0b;--c-info:#0891b2;--c-settings:#6b7280;--c-all:#1e293b;
}
html{font-size:15px}
body{font-family:'Helvetica Neue','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;font-size:1rem}

/* ===== Auth Screen ===== */
#authScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:40px;max-width:400px;width:100%}
.auth-logo{font-size:1.8rem;font-weight:800;letter-spacing:-.5px;text-align:center;margin-bottom:4px}
.auth-logo span{color:var(--accent)}
.auth-sub{text-align:center;color:var(--text-sub);font-size:.85rem;margin-bottom:28px}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.auth-tab{flex:1;padding:10px;background:transparent;color:var(--text-sub);font-weight:600;font-size:.9rem;transition:.2s}
.auth-tab.active{background:var(--accent);color:#fff}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--text-sub)}
.auth-field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);transition:.2s}
.auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.auth-btn{width:100%;padding:13px;background:var(--accent);color:#fff;border-radius:var(--radius);font-weight:700;font-size:1rem;transition:.2s}
.auth-btn:hover{background:#1d4ed8;transform:translateY(-1px);box-shadow:var(--shadow)}
.auth-error{color:var(--danger);font-size:.8rem;text-align:center;min-height:1.2em;margin-bottom:8px}

/* ===== Main Layout ===== */
#app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;z-index:100;transition:transform .3s;overflow-y:auto}
.sidebar-logo{font-size:1.3rem;font-weight:800;margin-bottom:24px;padding:0 8px}
.sidebar-logo span{color:var(--accent)}
.sidebar-section-label{font-size:.7rem;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px;padding:0 12px;margin:14px 0 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:var(--text-sub);font-size:.9rem;font-weight:600;transition:.15s;margin-bottom:2px;width:100%;text-align:left;background:transparent;position:relative}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{color:var(--text);font-weight:700}
.nav-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:.2s}
.nav-item.active .nav-dot{transform:scale(1.3)}
.nav-icon{font-size:1.1rem;width:20px;text-align:center}
.nav-count{margin-left:auto;font-size:.75rem;color:#bbb;font-weight:600}
.nav-item.active .nav-count{color:var(--text-sub)}
.sidebar-spacer{flex:1}
.sidebar-user{padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
.user-name{font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn{margin-left:auto;color:var(--text-sub);font-size:1.1rem;background:transparent;padding:4px}
.logout-btn:hover{color:var(--danger)}

.main{margin-left:240px;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.topbar h1{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar h1 .cat-badge-sm{font-size:.75rem;padding:2px 10px;border-radius:20px;color:#fff;font-weight:600}
.search-box{flex:1;max-width:380px;position:relative;min-width:140px}
.search-box input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);transition:.2s}
.search-box input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-light)}
.search-box::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.85rem;opacity:.5}
.lock-badge{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;font-size:.8rem;font-weight:700;transition:.2s;white-space:nowrap}
.lock-badge.locked{background:#f3f4f6;color:var(--text-sub);cursor:pointer}
.lock-badge.locked:hover{background:#e5e7eb}
.lock-badge.unlocked{background:#dcfce7;color:#16a34a;cursor:pointer}
.lock-badge.unlocked:hover{background:#bbf7d0}
.btn-add{padding:9px 18px;background:var(--accent);color:#fff;border-radius:var(--radius);font-weight:700;font-size:.85rem;transition:.2s;white-space:nowrap}
.btn-add:hover{background:#1d4ed8;transform:translateY(-1px);box-shadow:var(--shadow)}
.mobile-menu-btn{display:none;font-size:1.4rem;background:transparent;padding:4px}

.content{padding:24px;flex:1;max-width:1100px;width:100%;margin:0 auto}

/* Category Header */
.cat-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:3px solid var(--border)}
.cat-header .cat-badge{font-size:.95rem;padding:5px 18px;border-radius:20px;color:#fff;font-weight:700}
.cat-header .cat-count{font-size:.85rem;color:var(--text-sub);font-weight:600}
.cat-header .cat-line{flex:1;height:2px;border-radius:1px;opacity:.3}

/* Stats Cards */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid var(--border);transition:.2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat-num{font-size:1.6rem;font-weight:800;letter-spacing:-1px}
.stat-label{font-size:.75rem;color:var(--text-sub);margin-top:2px;font-weight:600}

/* URL Cards */
.url-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.url-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:.2s;position:relative;border-top:3px solid var(--border)}
.url-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.url-card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.url-favicon{width:28px;height:28px;border-radius:6px;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--text-sub);overflow:hidden}
.url-favicon img{width:100%;height:100%;object-fit:cover}
.url-title{font-weight:700;font-size:.92rem;line-height:1.4;flex:1;word-break:break-word}
.url-cat-badge{font-size:.7rem;padding:2px 10px;border-radius:20px;color:#fff;font-weight:700;white-space:nowrap;flex-shrink:0}
.url-desc{font-size:.82rem;color:var(--text-sub);margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.url-link{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;color:var(--accent);margin-bottom:10px;word-break:break-all}
.url-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.url-tag{font-size:.72rem;padding:3px 10px;background:var(--bg);border-radius:20px;color:var(--text-sub);font-weight:600}
.url-card-actions{display:flex;gap:6px}
.card-action{padding:5px 12px;font-size:.78rem;border-radius:6px;font-weight:600;transition:.15s}
.card-action.edit{background:var(--bg);color:var(--text-sub)}
.card-action.edit:hover{background:var(--accent-light);color:var(--accent)}
.card-action.del{background:var(--bg);color:var(--text-sub)}
.card-action.del:hover{background:#fee2e2;color:var(--danger)}

/* Lock overlay on cards when locked */
.url-card.locked-hover:hover{transform:none;box-shadow:var(--shadow)}

/* Empty State */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-sub)}
.empty-icon{font-size:3rem;margin-bottom:12px;opacity:.3}
.empty-title{font-size:1.1rem;font-weight:600;margin-bottom:4px;color:var(--text)}
.empty-desc{font-size:.85rem}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-head h2{font-size:1.1rem;font-weight:700;flex:1}
.modal-close{font-size:1.3rem;color:var(--text-sub);background:transparent;padding:4px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{padding:24px}
.form-field{margin-bottom:18px}
.form-field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--text-sub)}
.form-field input,.form-field textarea,.form-field select{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius);transition:.2s;background:var(--surface)}
.form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.form-field textarea{resize:vertical;min-height:60px}
.cat-select{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-option{padding:10px;border:2px solid var(--border);border-radius:var(--radius);text-align:center;font-size:.85rem;font-weight:700;cursor:pointer;transition:.15s;background:var(--surface);color:var(--text-sub)}
.cat-option:hover{border-color:var(--text-sub)}
.cat-option.selected{color:#fff;border-color:transparent;font-weight:700}
.cat-option .cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.btn-primary{padding:10px 22px;background:var(--accent);color:#fff;border-radius:var(--radius);font-weight:700;font-size:.9rem;transition:.2s}
.btn-primary:hover{background:#1d4ed8}
.btn-secondary{padding:10px 22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-weight:600;font-size:.9rem;color:var(--text-sub)}
.btn-secondary:hover{border-color:var(--text-sub);color:var(--text)}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:14px 18px;display:flex;align-items:center;gap:10px;min-width:280px;max-width:380px;animation:slideIn .3s ease}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--danger)}
.toast.info{border-left:4px solid var(--accent)}
.toast-icon{font-size:1.1rem}
.toast-msg{font-size:.85rem;font-weight:500;flex:1}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{to{transform:translateX(120%);opacity:0}}
.toast.out{animation:slideOut .3s ease forwards}

/* Settings */
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
.settings-section h3{font-size:1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);gap:16px}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:.9rem;font-weight:600}
.setting-desc{font-size:.78rem;color:var(--text-sub);margin-top:2px}
.toggle{position:relative;width:44px;height:24px;background:var(--border);border-radius:20px;transition:.2s;cursor:pointer;flex-shrink:0}
.toggle.on{background:var(--success)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on::after{left:22px}

/* Password Lock Section */
.lock-card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:28px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px}
.lock-card.unlocked{border-color:var(--success)}
.lock-icon-big{font-size:3rem;margin-bottom:12px}
.lock-status-text{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.lock-status-desc{font-size:.85rem;color:var(--text-sub);margin-bottom:20px}
.lock-input-group{display:flex;gap:10px;max-width:360px;margin:0 auto}
.lock-input-group input{flex:1;padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius);text-align:center;font-size:1.1rem;font-weight:700;letter-spacing:4px;transition:.2s}
.lock-input-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.lock-input-group button{padding:12px 24px;border-radius:var(--radius);font-weight:700;font-size:.9rem;transition:.2s;white-space:nowrap}
.lock-btn-unlock{background:var(--accent);color:#fff}
.lock-btn-unlock:hover{background:#1d4ed8}
.lock-btn-lock{background:#fee2e2;color:var(--danger);border:2px solid var(--danger)}
.lock-btn-lock:hover{background:var(--danger);color:#fff}
.lock-error{color:var(--danger);font-size:.82rem;margin-top:10px;min-height:1.2em}

/* ===== Responsive ===== */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-menu-btn{display:block}
  .content{padding:16px}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
  .stat-num{font-size:1.3rem}
  .url-grid{grid-template-columns:1fr}
  .topbar{padding:12px 16px;gap:10px}
  .search-box{order:5;max-width:100%;flex-basis:100%}
  .btn-add{padding:8px 14px;font-size:.8rem}
  .lock-badge{padding:6px 10px;font-size:.75rem}
  .modal{margin:10px}
  .toast-container{top:10px;right:10px;left:10px}
  .toast{min-width:auto;max-width:none}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;display:none}
  .sidebar-overlay.show{display:block}
  .cat-select{grid-template-columns:repeat(2,1fr)}
  .lock-input-group{flex-direction:column}
  .lock-input-group button{width:100%}
}
</style>
</head>
<body>

<!-- ===== Auth Screen ===== -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">Link<span>Base</span></div>
    <p class="auth-sub">あなたのURLを、まとめて、スマートに。</p>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">ログイン</button>
      <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">新規登録</button>
    </div>
    <div id="loginForm">
      <div class="auth-field">
        <label>ユーザー名</label>
        <input type="text" id="loginUser" placeholder="ユーザー名を入力" autocomplete="username">
      </div>
      <div class="auth-field">
        <label>パスワード</label>
        <input type="password" id="loginPass" placeholder="パスワードを入力" autocomplete="current-password">
      </div>
      <p class="auth-error" id="loginError"></p>
      <button class="auth-btn" onclick="doLogin()">ログイン</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="auth-field">
        <label>ユーザー名</label>
        <input type="text" id="regUser" placeholder="ユーザー名（3文字以上）" autocomplete="username">
      </div>
      <div class="auth-field">
        <label>パスワード</label>
        <input type="password" id="regPass" placeholder="パスワード（4文字以上）" autocomplete="new-password">
      </div>
      <p class="auth-error" id="regError"></p>
      <button class="auth-btn" onclick="doRegister()">アカウント作成</button>
    </div>
  </div>
</div>

<!-- ===== Main App ===== -->
<div id="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">Link<span>Base</span></div>
    <div class="sidebar-section-label">URLカテゴリ</div>
    <button class="nav-item active" data-view="all" onclick="switchView('all')">
      <span class="nav-dot" style="background:var(--c-all)"></span>
      <span class="nav-icon">📋</span> すべて
      <span class="nav-count" id="countAll">0</span>
    </button>
    <button class="nav-item" data-view="京王" onclick="switchView('京王')">
      <span class="nav-dot" style="background:var(--c-keio)"></span>
      <span class="nav-icon">🚃</span> 京王
      <span class="nav-count" id="count京王">0</span>
    </button>
    <button class="nav-item" data-view="JR" onclick="switchView('JR')">
      <span class="nav-dot" style="background:var(--c-jr)"></span>
      <span class="nav-icon">🚆</span> JR
      <span class="nav-count" id="countJR">0</span>
    </button>
    <button class="nav-item" data-view="大手私鉄" onclick="switchView('大手私鉄')">
      <span class="nav-dot" style="background:var(--c-major)"></span>
      <span class="nav-icon">🚇</span> 大手私鉄
      <span class="nav-count" id="count大手私鉄">0</span>
    </button>
    <button class="nav-item" data-view="その他" onclick="switchView('その他')">
      <span class="nav-dot" style="background:var(--c-other)"></span>
      <span class="nav-icon">🚉</span> その他
      <span class="nav-count" id="countその他">0</span>
    </button>
    <div class="sidebar-section-label">その他</div>
    <button class="nav-item" data-view="資料" onclick="switchView('資料')">
      <span class="nav-dot" style="background:var(--c-material)"></span>
      <span class="nav-icon">📄</span> 資料
      <span class="nav-count" id="count資料">0</span>
    </button>
    <button class="nav-item" data-view="情報" onclick="switchView('情報')">
      <span class="nav-dot" style="background:var(--c-info)"></span>
      <span class="nav-icon">ℹ️</span> 情報
      <span class="nav-count" id="count情報">0</span>
    </button>
    <div class="sidebar-section-label">システム</div>
    <button class="nav-item" data-view="settings" onclick="switchView('settings')">
      <span class="nav-dot" style="background:var(--c-settings)"></span>
      <span class="nav-icon">⚙️</span> 設定
    </button>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-user">
      <div class="user-avatar" id="sidebarAvatar">U</div>
      <span class="user-name" id="sidebarUserName">ユーザー</span>
      <button class="logout-btn" onclick="doLogout()" title="ログアウト">⏻</button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main">
    <header class="topbar">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
      <h1 id="pageTitle">すべて</h1>
      <div class="lock-badge locked" id="lockBadge" onclick="onLockBadgeClick()" title="クリックでロック操作">
        <span id="lockBadgeIcon">🔒</span> <span id="lockBadgeText">ロック中</span>
      </div>
      <button class="btn-add" id="btnAdd" style="display:none" onclick="openAddModal()">+ URL追加</button>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="URL、タイトル、タグで検索..." oninput="renderContent()">
      </div>
    </header>
    <div class="content" id="contentArea"></div>
  </div>
</div>

<!-- ===== Add/Edit URL Modal ===== -->
<div class="modal-overlay" id="urlModal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">URLを追加</h2>
      <button class="modal-close" onclick="closeModal('urlModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label>カテゴリ *</label>
        <div class="cat-select" id="catSelect"></div>
      </div>
      <div class="form-field">
        <label>URL *</label>
        <input type="url" id="formUrl" placeholder="https://example.com">
      </div>
      <div class="form-field">
        <label>タイトル *</label>
        <input type="text" id="formTitle" placeholder="サイト名やタイトル">
      </div>
      <div class="form-field">
        <label>説明</label>
        <textarea id="formDesc" placeholder="簡単なメモや説明（任意）"></textarea>
      </div>
      <div class="form-field">
        <label>タグ（カンマ区切り）</label>
        <input type="text" id="formTags" placeholder="例: 時刻表, 運賃, ニュース">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('urlModal')">キャンセル</button>
      <button class="btn-primary" id="saveUrlBtn" onclick="saveUrl()">保存</button>
    </div>
  </div>
</div>

<!-- ===== Toast Container ===== -->
<div class="toast-container" id="toastContainer"></div>

<script>
/* ============================================================
   LinkBase — URL Management App v2
   ============================================================ */

// ===== Constants =====
const EDIT_PASSWORD = '0829';
const ALL_CATS = ['京王','JR','大手私鉄','その他']; // 「すべて」に表示するカテゴリ
const EXTRA_CATS = ['資料','情報'];
const ALL_CATS_FULL = [...ALL_CATS, ...EXTRA_CATS];

const CAT_COLORS = {
  '京王':'var(--c-keio)','JR':'var(--c-jr)','大手私鉄':'var(--c-major)',
  'その他':'var(--c-other)','資料':'var(--c-material)','情報':'var(--c-info)'
};
const CAT_COLORS_HEX = {
  '京王':'#e63946','JR':'#2a9d8f','大手私鉄':'#2563eb',
  'その他':'#7c3aed','資料':'#f59e0b','情報':'#0891b2'
};
const CAT_ICONS = {
  '京王':'🚃','JR':'🚆','大手私鉄':'🚇','その他':'🚉','資料':'📄','情報':'ℹ️'
};

// ===== State =====
let currentUser = null;
let urls = [];
let editingId = null;
let editUnlocked = false;
let currentView = 'all';
let selectedCategory = '京王';
let settings = { notif:false, dup:true };

// ===== Storage =====
const SK_USERS='lb_users', SK_SESSION='lb_session';
const userKey = u => 'lb_urls_'+u;
const setKey = u => 'lb_settings_'+u;

function gid(id){ return document.getElementById(id); }
function nowISO(){ return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function getDomain(url){ try{ return new URL(url).hostname.replace('www.',''); }catch{ return ''; } }

// ===== Toast =====
function toast(msg, type='info'){
  const c = gid('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast '+type;
  const icons = {success:'✅',error:'⚠️',info:'ℹ️'};
  t.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span><span class="toast-msg">${escapeHtml(msg)}</span>`;
  c.appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),300); }, 3000);
}
function browserNotify(title, body){
  if(settings.notif && 'Notification' in window && Notification.permission==='granted'){
    new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔗</text></svg>' });
  }
}

// ===== Auth =====
function getUsers(){ try{ return JSON.parse(localStorage.getItem(SK_USERS))||{}; }catch{ return {}; } }
function saveUsers(u){ localStorage.setItem(SK_USERS, JSON.stringify(u)); }

function switchAuthTab(tab){
  const lt=gid('tabLogin'), rt=gid('tabRegister');
  const lf=gid('loginForm'), rf=gid('registerForm');
  if(tab==='login'){ lt.classList.add('active'); rt.classList.remove('active'); lf.style.display='block'; rf.style.display='none'; }
  else { rt.classList.add('active'); lt.classList.remove('active'); rf.style.display='block'; lf.style.display='none'; }
  gid('loginError').textContent=''; gid('regError').textContent='';
}

function doRegister(){
  const user=gid('regUser').value.trim(), pass=gid('regPass').value, err=gid('regError');
  if(user.length<3){ err.textContent='ユーザー名は3文字以上で入力してください'; return; }
  if(pass.length<4){ err.textContent='パスワードは4文字以上で入力してください'; return; }
  const users=getUsers();
  if(users[user]){ err.textContent='このユーザー名は既に使われています'; return; }
  users[user]={pass:btoa(pass), created:nowISO()};
  saveUsers(users);
  toast('アカウントを作成しました！ログインしてください','success');
  switchAuthTab('login');
  gid('loginUser').value=user;
  gid('regUser').value=''; gid('regPass').value='';
}

function doLogin(){
  const user=gid('loginUser').value.trim(), pass=gid('loginPass').value, err=gid('loginError');
  if(!user||!pass){ err.textContent='ユーザー名とパスワードを入力してください'; return; }
  const users=getUsers();
  if(!users[user]||users[user].pass!==btoa(pass)){ err.textContent='ユーザー名またはパスワードが間違っています'; return; }
  currentUser=user;
  localStorage.setItem(SK_SESSION, user);
  loadUserData();
  showApp();
  toast('おかえりなさい、'+user+'さん！','success');
}

function doLogout(){
  localStorage.removeItem(SK_SESSION);
  currentUser=null; urls=[]; editUnlocked=false;
  gid('app').style.display='none';
  gid('authScreen').style.display='flex';
  gid('loginUser').value=''; gid('loginPass').value='';
  toast('ログアウトしました','info');
}

function loadUserData(){
  try{ urls=JSON.parse(localStorage.getItem(userKey(currentUser)))||[]; }catch{ urls=[]; }
  try{ settings=JSON.parse(localStorage.getItem(setKey(currentUser)))||{notif:false,dup:true}; }catch{}
  applySettingsToggles();
}
function saveUrls(){ localStorage.setItem(userKey(currentUser), JSON.stringify(urls)); }
function saveSettings(){ localStorage.setItem(setKey(currentUser), JSON.stringify(settings)); }

function checkSession(){
  const s=localStorage.getItem(SK_SESSION);
  if(s){ const users=getUsers(); if(users[s]){ currentUser=s; loadUserData(); showApp(); } }
}

function showApp(){
  gid('authScreen').style.display='none';
  gid('app').style.display='block';
  gid('sidebarUserName').textContent=currentUser;
  gid('sidebarAvatar').textContent=currentUser.charAt(0).toUpperCase();
  editUnlocked=false;
  updateLockUI();
  switchView('all');
}

// ===== Navigation =====
function switchView(view){
  currentView=view;
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.toggle('active', n.dataset.view===view);
  });
  const titles={all:'すべて',settings:'設定'};
  const pageTitle=titles[view]||view;
  if(view!=='settings' && view!=='all'){
    gid('pageTitle').innerHTML=`<span class="cat-badge-sm" style="background:${CAT_COLORS_HEX[view]}">${CAT_ICONS[view]} ${view}</span>`;
  } else {
    gid('pageTitle').textContent=pageTitle;
  }
  renderContent();
  if(window.innerWidth<=768) closeSidebar();
}

function toggleSidebar(){ gid('sidebar').classList.toggle('open'); gid('sidebarOverlay').classList.toggle('show'); }
function closeSidebar(){ gid('sidebar').classList.remove('open'); gid('sidebarOverlay').classList.remove('show'); }

// ===== Content Rendering =====
function renderContent(){
  updateSidebarCounts();
  const area=gid('contentArea');
  if(currentView==='settings'){ area.innerHTML=renderSettingsHtml(); attachSettingsEvents(); return; }

  // Get filtered URLs
  let filtered;
  if(currentView==='all'){
    filtered = urls.filter(u => ALL_CATS.includes(u.category));
  } else {
    filtered = urls.filter(u => u.category===currentView);
  }

  // Apply search
  const q=gid('searchInput').value.trim().toLowerCase();
  if(q){
    filtered=filtered.filter(u=>
      (u.title||'').toLowerCase().includes(q) ||
      (u.url||'').toLowerCase().includes(q) ||
      (u.description||'').toLowerCase().includes(q) ||
      (u.tags||[]).some(t=>t.toLowerCase().includes(q))
    );
  }

  // Build HTML
  let html='';

  // Category header (not for 'all')
  if(currentView!=='all'){
    const color=CAT_COLORS_HEX[currentView];
    const count=filtered.length;
    html += `<div class="cat-header">
      <span class="cat-badge" style="background:${color}">${CAT_ICONS[currentView]} ${currentView}</span>
      <span class="cat-count">${count}件</span>
      <div class="cat-line" style="background:${color}"></div>
    </div>`;
  }

  // Stats row for 'all'
  if(currentView==='all'){
    html += '<div class="stats-row">';
    ALL_CATS.forEach(cat=>{
      const count=urls.filter(u=>u.category===cat).length;
      const color=CAT_COLORS_HEX[cat];
      html += `<div class="stat-card" style="border-left-color:${color}">
        <div class="stat-num">${count}</div>
        <div class="stat-label">${CAT_ICONS[cat]} ${cat}</div>
      </div>`;
    });
    const todayCount=urls.filter(u=>u.created && u.created.slice(0,10)===todayStr()).length;
    html += `<div class="stat-card" style="border-left-color:#22c55e">
      <div class="stat-num">${todayCount}</div>
      <div class="stat-label">📅 今日の追加</div>
    </div>`;
    html += '</div>';
  }

  // URL grid
  if(filtered.length===0){
    html += `<div class="empty-state">
      <div class="empty-icon">${currentView==='all'?'📋':CAT_ICONS[currentView]}</div>
      <div class="empty-title">${urls.length===0?'まだURLがありません':'このカテゴリにURLがありません'}</div>
      <div class="empty-desc">${editUnlocked?'「+ URL追加」ボタンから登録できます':'設定でパスワードを入力するとURLを追加できます'}</div>
    </div>`;
  } else {
    html += '<div class="url-grid">'+filtered.map(u=>urlCardHtml(u)).join('')+'</div>';
  }

  area.innerHTML=html;
}

function urlCardHtml(u){
  const color=CAT_COLORS_HEX[u.category]||'#999';
  const domain=getDomain(u.url);
  const favIcon=domain?`<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" onerror="this.style.display='none';this.parentElement.textContent='${domain.charAt(0).toUpperCase()}'" alt="">`:domain.charAt(0).toUpperCase();
  let actions='';
  if(editUnlocked){
    actions=`<div class="url-card-actions">
      <button class="card-action edit" onclick="openEditModal('${u.id}')">✏️ 編集</button>
      <button class="card-action del" onclick="deleteUrl('${u.id}')">🗑 削除</button>
    </div>`;
  }
  return `<div class="url-card${editUnlocked?'':' locked-hover'}" style="border-top-color:${color}">
    <div class="url-card-head">
      <div class="url-favicon">${favIcon}</div>
      <div class="url-title">${escapeHtml(u.title)}</div>
      <span class="url-cat-badge" style="background:${color}">${u.category}</span>
    </div>
    ${u.description?`<div class="url-desc">${escapeHtml(u.description)}</div>`:''}
    <a class="url-link" href="${escapeHtml(u.url)}" target="_blank" rel="noopener">${escapeHtml(u.url)}</a>
    ${(u.tags&&u.tags.length)?`<div class="url-tags">${u.tags.map(t=>`<span class="url-tag">${escapeHtml(t)}</span>`).join('')}</div>`:''}
    ${actions}
  </div>`;
}

function updateSidebarCounts(){
  gid('countAll').textContent=urls.filter(u=>ALL_CATS.includes(u.category)).length;
  ALL_CATS_FULL.forEach(cat=>{
    const el=gid('count'+cat);
    if(el) el.textContent=urls.filter(u=>u.category===cat).length;
  });
}

// ===== Category Select in Modal =====
function renderCatSelect(selected){
  const c=gid('catSelect');
  c.innerHTML=ALL_CATS_FULL.map(cat=>{
    const color=CAT_COLORS_HEX[cat];
    const sel=cat===selected?'selected':'';
    return `<div class="cat-option ${sel}" data-cat="${cat}" onclick="selectCategory('${cat}')" style="${sel?`background:${color}`:''}">
      <span class="cat-dot" style="background:${color}"></span>${CAT_ICONS[cat]} ${cat}
    </div>`;
  }).join('');
}
function selectCategory(cat){
  selectedCategory=cat;
  renderCatSelect(cat);
}

// ===== URL CRUD =====
function openAddModal(){
  if(!editUnlocked){ toast('編集ロック中です。設定でパスワードを入力してください','error'); return; }
  editingId=null;
  gid('modalTitle').textContent='URLを追加';
  gid('formUrl').value=''; gid('formTitle').value=''; gid('formDesc').value=''; gid('formTags').value='';
  gid('formUrl').readOnly=false;
  // Default to current view's category if viewing a specific category
  selectedCategory = ALL_CATS_FULL.includes(currentView) ? currentView : '京王';
  renderCatSelect(selectedCategory);
  openModal('urlModal');
  setTimeout(()=>gid('formUrl').focus(),100);
}

function openEditModal(id){
  if(!editUnlocked){ toast('編集ロック中です','error'); return; }
  const u=urls.find(x=>x.id===id);
  if(!u) return;
  editingId=id;
  gid('modalTitle').textContent='URLを編集';
  gid('formUrl').value=u.url;
  gid('formTitle').value=u.title;
  gid('formDesc').value=u.description||'';
  gid('formTags').value=(u.tags||[]).join(', ');
  gid('formUrl').readOnly=true;
  selectedCategory=u.category;
  renderCatSelect(selectedCategory);
  openModal('urlModal');
}

function saveUrl(){
  const url=gid('formUrl').value.trim();
  const title=gid('formTitle').value.trim();
  const desc=gid('formDesc').value.trim();
  const tagsRaw=gid('formTags').value.trim();
  if(!url){ toast('URLを入力してください','error'); return; }
  if(!title){ toast('タイトルを入力してください','error'); return; }
  try{ new URL(url); }catch{ toast('有効なURLを入力してください','error'); return; }
  if(!selectedCategory){ toast('カテゴリを選択してください','error'); return; }
  const tags=tagsRaw?tagsRaw.split(',').map(t=>t.trim()).filter(Boolean):[];

  if(editingId){
    const u=urls.find(x=>x.id===editingId);
    if(u){ u.title=title; u.description=desc; u.tags=tags; u.category=selectedCategory; u.updated=nowISO(); }
    toast('URLを更新しました','success');
  } else {
    if(settings.dup){
      const exists=urls.find(x=>x.url===url);
      if(exists){ toast('このURLは既に登録されています','error'); return; }
    }
    urls.unshift({id:'u'+Date.now()+Math.random().toString(36).slice(2,6), url, title, description:desc, tags, category:selectedCategory, created:nowISO()});
    toast('URLを追加しました！','success');
    browserNotify('URLを追加しました', title+' ['+selectedCategory+']');
  }
  saveUrls();
  closeModal('urlModal');
  renderContent();
}

function deleteUrl(id){
  const u=urls.find(x=>x.id===id);
  if(!u) return;
  if(confirm('「'+u.title+'」を削除しますか？')){
    urls=urls.filter(x=>x.id!==id);
    saveUrls();
    renderContent();
    toast('URLを削除しました','info');
  }
}

function openModal(id){ gid(id).classList.add('show'); }
function closeModal(id){ gid(id).classList.remove('show'); }

// ===== Edit Lock / Password =====
function unlockEdit(){
  const input=gid('lockPasswordInput');
  const errEl=gid('lockError');
  if(!input) return;
  if(input.value===EDIT_PASSWORD){
    editUnlocked=true;
    input.value='';
    if(errEl) errEl.textContent='';
    updateLockUI();
    renderContent();
    toast('編集ロックを解除しました！URLの追加・編集・削除が可能です','success');
    browserNotify('編集ロック解除', 'URLの編集が可能になりました');
  } else {
    if(errEl) errEl.textContent='パスワードが間違っています';
    input.value='';
    input.focus();
    toast('パスワードが間違っています','error');
  }
}

function lockEdit(){
  editUnlocked=false;
  updateLockUI();
  renderContent();
  toast('編集ロックしました','info');
}

function updateLockUI(){
  const badge=gid('lockBadge');
  const icon=gid('lockBadgeIcon');
  const text=gid('lockBadgeText');
  const btn=gid('btnAdd');
  if(editUnlocked){
    badge.className='lock-badge unlocked';
    icon.textContent='🔓'; text.textContent='編集可能';
    btn.style.display='inline-block';
  } else {
    badge.className='lock-badge locked';
    icon.textContent='🔒'; text.textContent='ロック中';
    btn.style.display='none';
  }
}

function onLockBadgeClick(){
  if(editUnlocked){
    lockEdit();
  } else {
    switchView('settings');
    setTimeout(()=>{
      const input=gid('lockPasswordInput');
      if(input) input.focus();
    },200);
  }
}

// ===== Settings =====
function renderSettingsHtml(){
  let html='';

  // Password Lock Section
  if(editUnlocked){
    html += `<div class="lock-card unlocked">
      <div class="lock-icon-big">🔓</div>
      <div class="lock-status-text" style="color:var(--success)">編集可能モード</div>
      <div class="lock-status-desc">URLの追加・編集・削除ができます</div>
      <button class="lock-btn-lock" onclick="lockEdit()">🔒 ロックする</button>
    </div>`;
  } else {
    html += `<div class="lock-card">
      <div class="lock-icon-big">🔒</div>
      <div class="lock-status-text">編集ロック中</div>
      <div class="lock-status-desc">パスワードを入力するとURLの追加・編集・削除が可能になります</div>
      <div class="lock-input-group">
        <input type="password" id="lockPasswordInput" placeholder="パスワード" maxlength="8" onkeydown="if(event.key==='Enter')unlockEdit()">
        <button class="lock-btn-unlock" onclick="unlockEdit()">ロック解除</button>
      </div>
      <div class="lock-error" id="lockError"></div>
    </div>`;
  }

  // Notification Settings
  html += `<div class="settings-section">
    <h3>🔔 通知設定</h3>
    <div class="setting-row">
      <div>
        <div class="setting-label">ブラウザ通知</div>
        <div class="setting-desc">URL追加時などにデスクトップ通知を表示</div>
      </div>
      <div class="toggle ${settings.notif?'on':''}" id="toggleNotif" onclick="toggleSetting('notif')"></div>
    </div>
    <div class="setting-row">
      <div>
        <div class="setting-label">重複URLアラート</div>
        <div class="setting-desc">同じURLを追加しようとした際に警告</div>
      </div>
      <div class="toggle ${settings.dup?'on':''}" id="toggleDup" onclick="toggleSetting('dup')"></div>
    </div>
  </div>`;

  // Account Info
  const users=getUsers();
  html += `<div class="settings-section">
    <h3>👤 アカウント情報</h3>
    <div class="setting-row">
      <div class="setting-label">ユーザー名</div>
      <div style="font-size:.9rem;color:var(--text-sub)">${escapeHtml(currentUser)}</div>
    </div>
    <div class="setting-row">
      <div class="setting-label">登録URL数</div>
      <div style="font-size:.9rem;color:var(--text-sub)">${urls.length} 件</div>
    </div>
    <div class="setting-row">
      <div class="setting-label">アカウント作成日</div>
      <div style="font-size:.9rem;color:var(--text-sub)">${users[currentUser]?.created?new Date(users[currentUser].created).toLocaleDateString('ja-JP'):'-'}</div>
    </div>
  </div>`;

  // Data Management
  html += `<div class="settings-section">
    <h3>💾 データ管理</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn-secondary" onclick="exportData('json')">JSONエクスポート</button>
      <button class="btn-secondary" onclick="exportData('csv')">CSVエクスポート</button>
      <button class="btn-secondary" onclick="clearAllUrls()" style="color:var(--danger);border-color:var(--danger)">全URLを削除</button>
    </div>
  </div>`;

  return html;
}

function attachSettingsEvents(){
  // Events are handled by inline onclick handlers
}

function toggleSetting(key){
  const map={notif:'toggleNotif', dup:'toggleDup'};
  settings[key]=!settings[key];
  const el=gid(map[key]);
  if(el) el.classList.toggle('on', settings[key]);
  saveSettings();
  if(key==='notif' && settings.notif){
    if('Notification' in window && Notification.permission!=='granted'){
      Notification.requestPermission().then(p=>{
        if(p!=='granted'){
          settings.notif=false;
          const t=gid('toggleNotif');
          if(t) t.classList.remove('on');
          saveSettings();
          toast('ブラウザの通知権限が必要です','error');
        } else {
          toast('ブラウザ通知を有効にしました','success');
        }
      });
    } else { toast('ブラウザ通知を有効にしました','success'); }
  } else {
    toast(settings[key]?'設定をオンにしました':'設定をオフにしました','info');
  }
}

function applySettingsToggles(){
  // Will be applied when settings HTML is rendered
}

// ===== Export =====
function exportData(format){
  if(urls.length===0){ toast('エクスポートするURLがありません','error'); return; }
  let content, filename, mime;
  if(format==='json'){
    content=JSON.stringify(urls,null,2);
    filename='linkbase_export.json'; mime='application/json';
  } else {
    const header='category,title,url,description,tags\n';
    const body=urls.map(u=>{
      const esc=s=>(s||'').replace(/"/g,'""');
      const tags=(u.tags||[]).join(',');
      return `"${esc(u.category)}","${esc(u.title)}","${esc(u.url)}","${esc(u.description)}","${esc(tags)}"`;
    }).join('\n');
    content=header+body; filename='linkbase_export.csv'; mime='text/csv';
  }
  const blob=new Blob([content],{type:mime});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`${format.toUpperCase()}エクスポート完了！`,'success');
}

function clearAllUrls(){
  if(urls.length===0){ toast('URLは既に空です','info'); return; }
  if(confirm('全てのURL（'+urls.length+'件）を削除しますか？この操作は取り消せません。')){
    urls=[]; saveUrls(); renderContent();
    toast('全URLを削除しました','info');
  }
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', ()=>{
  checkSession();
  gid('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
